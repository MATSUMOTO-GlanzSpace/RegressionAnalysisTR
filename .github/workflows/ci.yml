name: CI

on:
  push:
    branches: [ 'for_training' ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: '9.0.x'

    - name: Restore
      run: dotnet restore RegressionAnalysis.sln -p:EnableWindowsTargeting=true

    - name: Build
      run: dotnet build RegressionAnalysis.sln --configuration Release --no-restore -p:EnableWindowsTargeting=true

    - name: Test
      continue-on-error: true
      run: |
        dotnet test RegressionAnalysis.sln --configuration Release --no-build --verbosity normal -p:EnableWindowsTargeting=true
