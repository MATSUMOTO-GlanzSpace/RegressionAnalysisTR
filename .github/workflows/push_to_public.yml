name: Mirror for_training to public master

on:
  push:
    branches:
      - for_training
    paths-ignore:
      - '.github/workflows/**'

jobs:
  mirror-to-public:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository (full)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Add public remote
        env:
          PUBLIC_REPO_PAT: ${{ secrets.PUBLIC_REPO_PAT }}
        run: |
          # Public repo owner is same as private repository owner
          git remote add public https://x-access-token:${PUBLIC_REPO_PAT}@github.com/MATSUMOTO-GlanzSpace/RegressionAnalysisTR.git

      - name: Push to public master (exclude .github/workflows)
        run: |
          SOURCE_SHA="${GITHUB_SHA}"

          # Prepare source commit for public: remove workflow files first
          git checkout -B source-for-public "$SOURCE_SHA"
          git rm -r --ignore-unmatch .github/workflows
          if ! git diff --cached --quiet; then
            git commit -m "chore: exclude workflow files from public mirror"
          fi

          # Always mirror sanitized source as public/master
          # （公開側で履歴を作り直した後でも競合なく同期するため、merge ではなく上書き同期）
          git checkout -B public-master source-for-public

          # push mirrored result to public master (forced)
          git push public public-master:master --force
