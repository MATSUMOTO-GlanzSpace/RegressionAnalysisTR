name: Mirror for_training to public master

on:
  push:
    branches:
      - for_training

jobs:
  mirror-to-public:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository (full)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Add public remote
        env:
          PUBLIC_REPO_PAT: ${{ secrets.PUBLIC_REPO_PAT }}
        run: |
          # Public repo owner is same as private repository owner
          git remote add public https://x-access-token:${PUBLIC_REPO_PAT}@github.com/MATSUMOTO-GlanzSpace/RegressionAnalysisTR.git

      - name: Push to public master (exclude .github/workflows)
        run: |
          SOURCE_SHA="${GITHUB_SHA}"

          # Fetch public/master if exists
          if git ls-remote --exit-code public refs/heads/master; then
            git fetch public master
            # create or reset local public-master branch to public/master
            git checkout -B public-master public/master
            # merge source commit (for_training push) into public-master
            git merge --no-ff --no-edit "$SOURCE_SHA"
          else
            # public master does not exist yet — start from source commit
            git checkout -B public-master "$SOURCE_SHA"
          fi

          # Exclude workflow files from public mirror
          git rm -r --ignore-unmatch .github/workflows

          # Commit only when workflows were removed/changed
          if ! git diff --cached --quiet; then
            git commit -m "chore: exclude workflow files from public mirror"
          fi

          # push merged result to public master (non-forced)
          git push public public-master:master
